allowBuilds:
  '@prisma/engines': true
  core-js: false
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security patches for transitive dependencies; keep overrides within their major
# except brace-expansion 4, whose supported fix is the compatible 5.x line.
overrides:
  '@auth/core@<0.41.3': ^0.41.3
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=3.0.0 <5.0.12': ^5.0.12
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'nanoid@>=3.0.0 <3.3.18': ^3.3.18
  'postcss@>=8.0.0 <8.5.23': ^8.5.23
  'source-map-js@>=1.0.0 <1.2.2': ^1.2.2
