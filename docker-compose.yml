services:
  postgres:
    image: postgres:16
    container_name: briefpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefpilot
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:?Set COMPOSE_POSTGRES_PASSWORD before starting PostgreSQL}
      POSTGRES_DB: briefpilot_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefpilot_postgres_data:/var/lib/postgresql/data

volumes:
  briefpilot_postgres_data:
